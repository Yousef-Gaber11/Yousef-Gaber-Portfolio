<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- خلفية تدرج زجاجي داكن وراقي -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95" />
    </linearGradient>

    <!-- تدرج لوني للحروف يتماشى مع الثيم (Accent & Primary) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- توهج خفيف وظل زجاجي -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- خلفية الدائرة الأساسية بتصميم Glass Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#glassBg)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" />

  <!-- لمعة زجاجية فوق الخفيف -->
  <path d="M 64 128 C 160 64, 352 64, 448 128 C 384 80, 128 80, 64 128 Z" fill="rgba(255, 255, 255, 0.08)" />

  <!-- الحرفين YG بتصميم Modern Typography -->
  <text x="50%" y="54%" dominant-baseline="central" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="180" letter-spacing="-4" fill="url(#textGrad)" filter="url(#glow)">YG</text>
  
  <!-- طبقة حادة للحروف فوق التوهج -->
  <text x="50%" y="54%" dominant-baseline="central" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="180" letter-spacing="-4" fill="url(#textGrad)">YG</text>
</svg>
